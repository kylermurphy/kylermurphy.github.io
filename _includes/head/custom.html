{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply the saved or device colour scheme before first paint (avoids a light flash) -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  })();
</script>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- KRM brand icons (images/brand/) -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/brand/favicon.svg"/>
<link rel="icon" href="{{ base_path }}/images/brand/favicon.ico" sizes="48x48"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/brand/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/brand/favicon-16x16.png" sizes="16x16"/>
<link rel="apple-touch-icon" href="{{ base_path }}/images/brand/apple-touch-icon.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#0B1F3B"/>

<!-- end custom head snippets -->
